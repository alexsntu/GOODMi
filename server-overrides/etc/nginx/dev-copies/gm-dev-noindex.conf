# Тестовая копия не индексируется (2026-10-18): заголовок noindex на всех ответах и robots.txt «запретить всё»,
# robots.txt открыт без пароля, чтобы робот его прочитал. Папку vhosts-resources панель ISPmanager не трогает.
add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
location = /robots.txt {
	satisfy any;
	allow all;
	default_type text/plain;
	add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
	return 200 "User-agent: *\nDisallow: /\n";
}
