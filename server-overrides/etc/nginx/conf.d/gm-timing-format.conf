# Журнал времени ответа PHP (2026-10-18): пулы goodmi/maxmobiles упираются в предел 5 процессов (с 13.10 в десятки раз чаще),
# а запросов стало меньше – значит, отдельные запросы долго держат процесс. Пишется только то, что дошло до PHP, в
# /var/log/nginx/gm-timing-<сайт>.log (ротация – стандартная /etc/logrotate.d/nginx, 14 дней). Подключение –
# vhosts-resources/<сайт>/gm-timing-log.conf. rt – весь запрос, uht – до заголовков от PHP (включая ожидание свободного
# процесса), sid=1 – у посетителя есть cookie сайта (человек, а не бот).
map $upstream_response_time $gm_to_php { "" 0; default 1; }
map $http_cookie $gm_has_sid { "~sid_customer_" 1; default 0; }
log_format gm_timing '$time_iso8601 $remote_addr $host "$request" $status $body_bytes_sent rt=$request_time uht=$upstream_header_time urt=$upstream_response_time sid=$gm_has_sid "$http_user_agent"';
