# Отсев ботов по названию и поиска уязвимостей на самом сервере (2026-10-13) – для сайтов, которые НЕ стоят за NGENIX.
# Сейчас включено только для xione.ru (vhosts-resources/xione.ru/gm-bot-filter.conf). Список повторяет правила,
# которые для goodmi.ru и maxmobiles.ru заданы в NGENIX (набор «Нежелательные страны + Meta-бот»).
# Поисковики (Яндекс, Google, Bing) и ИИ-поиск (Perplexity, OpenAI, Claude) сюда намеренно не входят.
map $http_user_agent $gm_bot_named {
    default 0;
    "~*(meta-externalagent|facebookexternalhit|facebookcatalog)" 1;
    "~*(AhrefsBot|SemrushBot|MJ12bot|SERankingBacklinksBot|DotBot)" 1;
    "~*(Scrapy|GeedoShopProductFinder|keys-so-bot|t2i-data-curation)" 1;
}
map $request_uri $gm_bot_probe {
    default 0;
    "~*(\.env|/\.git|wp-login\.php)" 1;
}
