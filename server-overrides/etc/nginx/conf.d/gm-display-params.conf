# Боты без cookie на страницах с параметрами отображения (2026-10-19, решение пользователя): «Скидки» Maxmobiles, «Новинки»
# GOODMi и категории с sort_by / sort_order / items_per_page / layout – каждая комбинация для CS-Cart новая страница (до 2 с
# выборки по каталогу), боты перебирают сотни комбинаций. Запрос БЕЗ ЕДИНОГО cookie (браузер человека после первой страницы шлёт
# ab__device) с такими параметрами – 301 на тот же адрес без них; features_hash (фильтр) сохраняется. Не трогаем .php
# (админка heaven.php, index.php?dispatch=…) и не-GET. Подключение – vhosts-resources/{goodmi.ru,maxmobiles.ru}/gm-display-params.conf
map $http_cookie $gm_no_cookie { "" 1; default 0; }
map $args $gm_display_args { "~(^|&)(sort_by|sort_order|items_per_page|layout)=" 1; default 0; }
map $uri $gm_page_path { "~\.php$" 0; default 1; }
map $args $gm_keep_filter { "~(^|&)(?<gm_fh>features_hash=[^&]*)" "?$gm_fh"; default ""; }
map "$request_method:$gm_no_cookie:$gm_display_args:$gm_page_path" $gm_strip_display { "GET:1:1:1" 1; "HEAD:1:1:1" 1; default 0; }
