# 2026-10-18: CS-Cart (fn_get_ip, лимиты СМС кабинетов) берёт адрес посетителя из ПЕРВОГО значения X-Forwarded-For и похожих заголовков,
# а их посетитель подделывает сам (NGENIX только дописывает настоящий адрес в конец). Отдаём PHP эти заголовки пустыми – CS-Cart берёт
# REMOTE_ADDR, который nginx уже выставил по X-Real-IP только от узлов NGENIX (../ngenix-realip.conf). Обычный покупатель получает тот же адрес.
# Подключается в location @php (include dynamic/*.conf). Откат: удалить файл, nginx -t, systemctl reload nginx.
fastcgi_param HTTP_X_FORWARDED_FOR "";
fastcgi_param HTTP_X_FORWARDED "";
fastcgi_param HTTP_FORWARDED_FOR "";
fastcgi_param HTTP_FORWARDED "";
fastcgi_param HTTP_FORWARDED_IP "";
fastcgi_param HTTP_X_COMING_FROM "";
fastcgi_param HTTP_COMING_FROM "";
fastcgi_param HTTP_CLIENT_IP "";
fastcgi_param HTTP_XROXY_CONNECTION "";
fastcgi_param HTTP_PROXY_CONNECTION "";
