# 2026-10-18 (инцидент): в images/, upgrades/ и app/lib/vendor/ лежали закладки взломщика (веб-шеллы), и через сайт их запускали
# (10.10 – upgrades/source_restora.php → 200). Запуск PHP из папок с данными запрещён; папка bonusplus/ (140 тыс. файлов
# с телефонами покупателей – их пишут bonusplus.php и bonuspluscard.php в корне, через сайт их никто не читает) закрыта целиком,
# как и журналы обмена с МойСклад (logsklad/, mc_log/) и старые выгрузки Сбера (sber/, последняя – 20.11.2025).
# Уровень server: срабатывает до выбора location, вложенные правила PHP его не обходят. Откат: удалить файл, nginx -t, reload.
if ($uri ~* "^/(images|img|upgrades|var|wp-content|app/lib|design|js|css)/.*\.(php[0-9]*|phtml|phar|pht|inc)(/|$)") {
	return 403;
}
if ($uri ~* "^/(bonusplus|logsklad|mc_log|sber)/") {
	return 403;
}
