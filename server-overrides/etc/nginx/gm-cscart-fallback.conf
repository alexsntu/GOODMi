# CS-Cart: адреса категорий и товаров (ЧПУ) – всё, чего нет на диске, отдаём index.php. Вынесено из vhost (2026-10-18):
# ISPmanager при смене версии PHP удаляет ручной блок @fallback из vhost, а try_files в location / на него ссылается –
# весь каталог отдаёт 500 (воспроизведено на dev). Папку vhosts-resources панель не трогает.
location @fallback {
	rewrite ^(.*)$ /index.php?$args last;
}
