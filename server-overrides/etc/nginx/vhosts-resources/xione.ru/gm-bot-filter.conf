# Xione: отказ ботам (2026-10-13). Условия заданы в /etc/nginx/conf.d/gm-bot-filter.conf (обходчики – те же три
# правила, что у goodmi.ru) и /etc/nginx/conf.d/gm-bot-names.conf (боты по названию и поиск уязвимостей:
# сайт не стоит за NGENIX, поэтому этот отсев делается здесь).
if ($gm_bot_block) {
    return 403;
}
if ($gm_bot_named) {
    return 403;
}
if ($gm_bot_probe) {
    return 403;
}
