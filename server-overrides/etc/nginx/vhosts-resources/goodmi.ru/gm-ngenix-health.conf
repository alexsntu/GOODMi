# Проверки здоровья NGENIX с условным именем сайта (Host s66095 / s63896, UA «NCDN/…») – 90 % проверок, ~115 тыс. в сутки,
# половина всей работы PHP и пачки по 40–65 в секунду с 14.10. PHP отвечал им 301 на https://maxmobiles.ru/ – теперь тот же ответ
# даёт nginx (2026-10-19, решение пользователя). Проверки с настоящим именем (Host goodmi.ru / maxmobiles.ru, ~10 %) по-прежнему
# идут в PHP и получают главную – по ним NGENIX видит, что сайт жив. Убрать – удалить файл, nginx -t && reload.
set $gm_ncdn "";
if ($http_user_agent ~ "^NCDN/") { set $gm_ncdn "u"; }
if ($host ~ "^s[0-9]+$") { set $gm_ncdn "${gm_ncdn}h"; }
if ($gm_ncdn = "uh") { return 301 https://maxmobiles.ru/; }
