# GOODMi: API маркетинг-портала для облачных routines (2026-10-21) – модуль gm_marketing.
# https://goodmi.ru/mkt-api/<путь> (раньше https://price.maxmobiles.ru/api/<путь>) → /mkt-api.php?gm_path=<путь>, строка запроса
# (?status=…&limit=…) добавляется сама; mkt-api.php передаёт запрос CS-Cart как index.php?dispatch=gm_marketing.api.
# Доступ – токен в заголовке Authorization: Bearer (проверяет controllers/frontend/gm_marketing.php).
location ^~ /mkt-api/ {
	rewrite ^/mkt-api/(.*)$ /mkt-api.php?gm_path=$1 last;
}
