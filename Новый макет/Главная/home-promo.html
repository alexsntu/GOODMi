<style>
.gm-promo { padding: 30px 0; }

.gm-promo-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}
.gm-promo-title {
  font-size: 22px;
  font-weight: 700;
  color: #222;
  text-decoration: none;
  transition: color 0.2s;
}
.gm-promo-title:hover { color: #ff6900; }

.gm-promo-nav { display: flex; gap: 8px; flex-shrink: 0; }
.gm-promo-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1.5px solid #ccc;
  background: #fff;
  color: #555;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  transition: border-color 0.2s, color 0.2s;
}
.gm-promo-btn:hover:not(:disabled) { border-color: #ff6900; color: #ff6900; }
.gm-promo-btn:disabled { opacity: 0.3; cursor: default; }
.gm-promo-btn svg { display: block; }

.gm-promo-wrap { overflow: hidden; }
.gm-promo-track {
  display: flex;
  gap: 16px;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  scroll-behavior: smooth;
  scrollbar-width: none;
  -ms-overflow-style: none;
}
.gm-promo-track::-webkit-scrollbar { display: none; }

.gm-promo-card {
  flex: 0 0 calc(31% - 8px);
  scroll-snap-align: start;
  border-radius: 12px;
  overflow: hidden;
  text-decoration: none;
  color: #222;
  background: #f5f5f5;
  display: block;
  transition: box-shadow 0.2s;
}
.gm-promo-card:hover { box-shadow: 0 6px 24px rgba(0,0,0,0.12); }
.gm-promo-card:hover .gm-promo-name { color: #ff6900; }

.gm-promo-img-wrap {
  width: 100%;
  aspect-ratio: 16 / 9;
  overflow: hidden;
  background: #e8e8e8;
}
.gm-promo-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.35s ease;
}
.gm-promo-card:hover .gm-promo-img { transform: scale(1.04); }

.gm-promo-info { padding: 14px 16px 16px; }
.gm-promo-name {
  font-size: 15px;
  font-weight: 600;
  line-height: 1.3;
  color: #222;
  transition: color 0.2s;
}

@media (max-width: 768px) {
  .gm-promo-title { font-size: 18px; }
  .gm-promo-card { flex: 0 0 calc(85% - 8px); }
}
</style>

<script>
(function () {
  var track = document.querySelector('.gm-promo-track');
  var prev = document.querySelector('.gm-promo-prev');
  var next = document.querySelector('.gm-promo-next');
  if (!track || !prev || !next) return;

  function cardStep() {
    var card = track.querySelector('.gm-promo-card');
    if (!card) return 300;
    var gap = parseFloat(window.getComputedStyle(track).gap) || 16;
    return card.offsetWidth + gap;
  }

  function updateBtns() {
    prev.disabled = track.scrollLeft <= 1;
    next.disabled = track.scrollLeft >= track.scrollWidth - track.offsetWidth - 1;
  }

  prev.addEventListener('click', function () {
    track.scrollBy({ left: -cardStep(), behavior: 'smooth' });
  });
  next.addEventListener('click', function () {
    track.scrollBy({ left: cardStep(), behavior: 'smooth' });
  });

  track.addEventListener('scroll', updateBtns);
  updateBtns();
})();
</script>
