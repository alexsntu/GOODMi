<script>
(function () {
  var nav = document.querySelector('.gm-hm-nav');
  if (!nav) return;
  if (!window.matchMedia || !window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;
  var items = Array.prototype.slice.call(nav.querySelectorAll('.gm-hm-item'));
  var MAX_SCALE = 1.18;
  var FALLOFF = 150;

  function update(mouseX) {
    items.forEach(function (item) {
      var rect = item.getBoundingClientRect();
      var cx = rect.left + rect.width / 2;
      var dist = Math.abs(mouseX - cx);
      var ratio = Math.max(0, 1 - dist / FALLOFF);
      var scale = 1 + (MAX_SCALE - 1) * ratio;
      item.style.transform = 'scale(' + scale.toFixed(3) + ')';
      item.style.zIndex = ratio > 0.01 ? '10' : '1';
    });
  }

  function reset() {
    items.forEach(function (item) {
      item.style.transform = 'scale(1)';
      item.style.zIndex = '1';
    });
  }

  nav.addEventListener('mousemove', function (e) { update(e.clientX); });
  nav.addEventListener('mouseleave', reset);
})();
</script>
