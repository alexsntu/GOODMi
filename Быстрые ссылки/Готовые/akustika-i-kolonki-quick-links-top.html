<section class="gm-quick-links-top gm-section" aria-label="Быстрые ссылки по категориям">
  <div class="gm-quick-links-top-inner">
    <nav id="gm-ql-akustika-i-kolonki-top-nav" aria-label="Быстрые ссылки по категориям" class="gm-quick-links-tags">
      <a href="https://goodmi.ru/akustika-i-kolonki/stantsiya-3/" class="gm-quick-link">Яндекс Станция 3</a>
      <a href="https://goodmi.ru/akustika-i-kolonki/stantsiya-mini-3-pro/" class="gm-quick-link">Яндекс Станция Мини 3 Про</a>
      <a href="https://goodmi.ru/akustika-i-kolonki/stantsiya-mini-3/" class="gm-quick-link">Яндекс Станция Мини 3</a>
      <a href="https://goodmi.ru/akustika-i-kolonki/stantsiya-layt-2/" class="gm-quick-link">Яндекс Станция Лайт 2</a>
      <a href="https://goodmi.ru/akustika-i-kolonki/stantsiya-midi/" class="gm-quick-link">Яндекс Станция Миди</a>
      <a href="https://goodmi.ru/akustika-i-kolonki/stantsiya-street/" class="gm-quick-link">Яндекс Станция Стрит</a>
      <a href="https://goodmi.ru/akustika-i-kolonki/umnye-kolonki/" class="gm-quick-link">Умные колонки</a>
      <a href="https://goodmi.ru/akustika-i-kolonki/besprovodnye/" class="gm-quick-link">Беспроводные</a>
    </nav>
    <div class="gm-ql-trigger">
      <button id="gm-ql-akustika-i-kolonki-top-btn" class="gm-ql-btn" aria-expanded="false" aria-controls="gm-ql-akustika-i-kolonki-top-nav">
        <span class="gm-ql-btn-text">Показать ещё</span>
        <span class="gm-ql-chevron" aria-hidden="true">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M2 4L6 8L10 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
      </button>
    </div>
  </div>
</section>

<script>
(function () {
  var nav = document.getElementById('gm-ql-akustika-i-kolonki-top-nav');
  var btn = document.getElementById('gm-ql-akustika-i-kolonki-top-btn');
  if (!nav || !btn) return;

  var links = Array.prototype.slice.call(nav.querySelectorAll('.gm-quick-link'));
  var btnText = btn.querySelector('.gm-ql-btn-text');
  var chevron = btn.querySelector('.gm-ql-chevron');
  var expanded = false;
  var overflowLinks = [];
  var resizeTimer;

  function calcRows() {
    if (!links.length) {
      btn.style.display = 'none';
      return;
    }
    links.forEach(function (l) { l.classList.remove('gm-ql-hidden'); });
    overflowLinks = [];
    var firstTop = links[0].offsetTop;
    links.forEach(function (link) {
      if (link.offsetTop > firstTop + 4) { overflowLinks.push(link); }
    });
    if (!overflowLinks.length) {
      btn.style.display = 'none';
      return;
    }
    btn.style.display = '';
    if (!expanded) {
      overflowLinks.forEach(function (l) { l.classList.add('gm-ql-hidden'); });
    }
  }

  function toggle() {
    expanded = !expanded;
    overflowLinks.forEach(function (l) { l.classList.toggle('gm-ql-hidden', !expanded); });
    btnText.textContent = expanded ? 'Свернуть' : 'Показать ещё';
    chevron.style.transform = expanded ? 'rotate(180deg)' : '';
    btn.setAttribute('aria-expanded', String(expanded));
  }

  btn.addEventListener('click', toggle);
  window.addEventListener('resize', function () {
    if (expanded) return;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(calcRows, 150);
  });
  requestAnimationFrame(function () { requestAnimationFrame(calcRows); });
}());
</script>
